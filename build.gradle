// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal() // Ensure Gradle can find plugins like Hilt
    }
    dependencies {
        classpath(libs.gradle) // Android Gradle Plugin
        classpath(libs.kotlin.gradle.plugin) // Kotlin Gradle Plugin
        classpath(libs.androidx.navigation.safeargs.plugin) // Navigation Safe Args
        classpath(libs.hilt.android.gradle.plugin) // Hilt stable 2025

    }
}

plugins {
    alias(libs.plugins.github.ben.manes)
    alias(libs.plugins.hilt) apply (false)
}

tasks.register("clean", Delete) {
    delete(rootProject.layout.buildDirectory)
}
